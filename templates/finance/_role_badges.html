<div class="mb-3">
    <strong>Роль в системе:</strong>
    {% if current_user.is_admin %}
        <span class="badge bg-danger">admin</span>
    {% endif %}
    {% if current_user.role_financier or current_user.can_view_finance or current_user.can_edit_finance %}
        <span class="badge bg-success">finance</span>
    {% endif %}
    {% if current_user.can_edit_mdm %}
        <span class="badge bg-primary">mdm-editor</span>
    {% elif current_user.can_view_mdm %}
        <span class="badge bg-secondary">mdm-viewer</span>
    {% endif %}
</div>
