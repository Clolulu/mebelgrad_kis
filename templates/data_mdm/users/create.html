{% extends "base.html" %}

{% block title %}Создание пользователя | КИС "МебельГрад"{% endblock %}

{% block content %}
<section class="hero-strip">
    <div>
        <div class="text-uppercase text-secondary small">Управление данными / Пользователи</div>
        <h1 class="h3 mb-2">Создание пользователя</h1>
        <p class="mb-0">Добавьте нового пользователя в систему.</p>
    </div>
</section>

<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="surface p-4">
            <form method="post" class="vstack gap-3">
                <div class="row">
                    <div class="col-md-6">
                        <label class="form-label" for="username">Имя</label>
                        <input class="form-control" id="username" name="username" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="email">Email</label>
                        <input class="form-control" id="email" name="email" type="email" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6">
                        <label class="form-label" for="phone">Телефон</label>
                        <input class="form-control" id="phone" name="phone" type="tel" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="password">Пароль</label>
                        <input class="form-control" id="password" name="password" type="password" required>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6">
                        <label class="form-label" for="password_repeat">Повторите пароль</label>
                        <input class="form-control" id="password_repeat" name="password_repeat" type="password" required>
                    </div>
                </div>

                <div class="border-top pt-3">
                    <h5 class="mb-3">Назначить роли</h5>
                    <div class="form-check mb-2">
                        <input class="form-check-input" id="role_admin" name="role_admin" type="checkbox">
                        <label class="form-check-label" for="role_admin">
                            <strong>Админ</strong> - Полный доступ к системе
                        </label>
                    </div>
                    <div class="form-check mb-2">
                        <input class="form-check-input" id="role_financier" name="role_financier" type="checkbox">
                        <label class="form-check-label" for="role_financier">
                            <strong>Финансист</strong> - Управление финансами и платежами
                        </label>
                    </div>
                    <div class="form-check mb-2">
                        <input class="form-check-input" id="role_warehouse" name="role_warehouse" type="checkbox">
                        <label class="form-check-label" for="role_warehouse">
                            <strong>Кладовщик</strong> - Управление складом и остатками
                        </label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" id="role_seller" name="role_seller" type="checkbox">
                        <label class="form-check-label" for="role_seller">
                            <strong>Продавец</strong> - Оформление продаж и заказов
                        </label>
                    </div>
                </div>

                <div class="form-check">
                    <input class="form-check-input" id="is_active" name="is_active" type="checkbox" checked>
                    <label class="form-check-label" for="is_active">Активный аккаунт</label>
                </div>

                <div class="d-flex gap-2">
                    <button class="btn btn-primary" type="submit">Создать пользователя</button>
                    <a href="{{ url_for('mdm.users_list') }}" class="btn btn-outline-secondary">Отмена</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
